plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.honor.parent'
    compileSdk rootProject.compile_sdk

    defaultConfig {
        applicationId "com.honor.parent"
        minSdk rootProject.min_sdk
        targetSdk rootProject.target_sdk
        versionCode 24
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "HonorAppBlocker-parent-${variant.buildType.name}-${variant.versionName}.apk"
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                'META-INF/DEPENDENCIES', 'META-INF/AL2.0', 'META-INF/LGPL2.1',
                'META-INF/ECLIPSEFRAK_LICENSE', 'META-INF/ECLIPSEFRAK_COPYING',
                'META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties',
                'META-INF/MANIFEST.MF'
            ]
            pickFirsts += ['**/io.netty.versions.properties']
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // v3.0 MQTT 跨网络远程控制 —— HiveMQ 客户端
    implementation 'com.hivemq:hivemq-mqtt-client:1.3.10'
}
