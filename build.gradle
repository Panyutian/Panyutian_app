// 项目级 build.gradle
import groovy.json.JsonSlurper

// 从 version.json 读取版本号，以后只改这一个文件就行
def versionJsonFile = rootProject.file('version.json')
def versionJson = new JsonSlurper().parseText(versionJsonFile.text)
ext.parentVersionCode = versionJson.parent.versionCode
ext.parentVersionName = versionJson.parent.versionName
ext.childVersionCode = versionJson.child.versionCode
ext.childVersionName = versionJson.child.versionName

buildscript {
    ext {
        compile_sdk = 34
        min_sdk = 24
        target_sdk = 34
        // Android Studio Quail (Canary) 使用 Gradle 9.x，必须升级 AGP 和 Kotlin 版本
        // 兼容组合：Gradle 9.2/9.3  +  AGP 8.7.0+  +  Kotlin 2.0.x
        kotlin_version = "2.0.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.7.0 兼容 Gradle 8.9 ~ 9.x（修复 Gradle 9.x 中 DependencyHandler.module() 被移除的崩溃）
        classpath "com.android.tools.build:gradle:8.7.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

// 双端 APK 构建完成后自动集中复制到 APK/ 文件夹，方便统一上传 GitHub
tasks.register('copyApks', Copy) {
    from('child/build/outputs/apk/debug')
    from('parent/build/outputs/apk/debug')
    include '*.apk'
    into('APK')
}

subprojects {
    tasks.matching { it.name == 'assembleDebug' }.configureEach {
        finalizedBy ':copyApks'
    }
}
